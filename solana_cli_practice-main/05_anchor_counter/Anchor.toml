[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
counter = "BFAo2HceTs8EcDRMi9gLBCtiGXkVtGsG2AxEqEkYZ2PB"

[programs.localnet]
counter = "HsBg6tbg7bEB8HigAHRnk8k9obB8wZWW5wybNYWQF6v2"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899
